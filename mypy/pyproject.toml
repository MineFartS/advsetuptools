[build-system]
requires = [
    # NOTE: this needs to be kept in sync with mypy-requirements.txt
    # and build-requirements.txt, because those are both needed for
    # self-typechecking :/
    "setuptools >= 77.0.3",
    # the following is from mypy-requirements.txt/setup.py
    "typing_extensions>=4.6.0; python_version<'3.15'",
    "typing_extensions>=4.16.0; python_version>='3.15'",
    "mypy_extensions>=1.0.0",
    "pathspec>=1.0.0",
    "tomli>=1.1.0; python_version<'3.11'",
    "librt>=0.16.0; platform_python_implementation != 'PyPy'",
    # the following is from build-requirements.txt
    "types-psutil",
    "types-setuptools",
    # required to work around a mypyc import bug
    "ast-serialize>=0.12.1,<1.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "mypy"
requires-python = ">=3.10"
dependencies = [
  # When changing this, also update build-system.requires and mypy-requirements.txt
  "typing_extensions>=4.6.0; python_version<'3.15'",
  "typing_extensions>=4.14.0; python_version>='3.15'",
  "mypy_extensions>=1.0.0",
  "pathspec>=1.0.0",
  "tomli>=1.1.0; python_version<'3.11'",
  "librt>=0.16.0; platform_python_implementation != 'PyPy'",
  "ast-serialize>=0.12.1,<1.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dmypy = ["psutil>=4.0"]
mypyc = ["setuptools>=50"]
reports = ["lxml"]
install-types = ["pip"]
faster-cache = ["orjson"]
native-parser = []

[project.scripts]
mypy = "mypy.__main__:console_entry"
stubgen = "mypy.stubgen:main"
stubtest = "mypy.stubtest:main"
dmypy = "mypy.dmypy.client:console_entry"
mypyc = "mypyc.__main__:main"

[tool.setuptools.packages.find]
include = ["mypy*", "mypyc*", "*__mypyc*"]
namespaces = false

[tool.setuptools.package-data]
mypy = [
  "py.typed",
  "typeshed/**/*.py",
  "typeshed/**/*.pyi",
  "typeshed/stdlib/VERSIONS",
  "xml/*.xsd",
  "xml/*.xslt",
  "xml/*.css",
]
[tool.setuptools.exclude-package-data]
mypyc = [
  "README.md",
  "doc/**",
  "external/**",
  "lib-rt/test_capi.cc",
  "lib-rt/setup.py",
]

[tool.black]
line-length = 99
target-version = ["py310", "py311", "py312", "py313", "py314"]
skip-magic-trailing-comma = true
force-exclude = '''
^/mypy/typeshed|
'''

extend-exclude = [
  "@*",
  # Sphinx configuration is irrelevant
  "docs/source/conf.py",
  "mypyc/doc/conf.py",
  # typeshed has its own .pyi-specific configuration
  "mypy/typeshed/*",
]

[tool.check-manifest]
ignore = ["**/.readthedocs.yaml"]

[tool.coverage.run]
branch = true
source = ["mypy"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  '\#\s*pragma: no cover',
  '^\s*raise AssertionError\b',
  '^\s*raise NotImplementedError\b',
  '^\s*return NotImplemented\b',
  '^\s*raise$',
  '^assert False\b',
  '''^if __name__ == ['"]__main__['"]:$''',
]
