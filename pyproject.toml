[build-system]
requires = [ "setuptools>=74.1" ]
build-backend = "setuptools.build_meta"

[project]
name = "pybind-setup-ext"
version = "v0"
requires-python = ">=3.12"
dependencies = [
    "setuptools>=74.1",
    "pybind11 @ git+https://github.com/MineFartS/pybind11",
    "mypy @ git+https://github.com/MineFartS/mypy"
]

