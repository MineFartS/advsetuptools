[build-system]
requires = [ "setuptools>=74.1" ]
build-backend = "setuptools.build_meta"

[project]
name = "pybind-setup-ext"
version = "v0"
requires-python = ">=3.12"
dependencies = [
    "setuptools>=74.1",
    "pybind11 @ file:pybind11",
    "mypy @ git+https://github.com/MineFartS/mypy"
]

[tool.setuptools.packages.find]
include = ["pybind_setup_ext*"]
exclude = ["pybind11*"]

