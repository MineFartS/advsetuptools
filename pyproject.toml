[build-system]
requires = [ "setuptools>=74.1" ]
build-backend = "setuptools.build_meta"

[project]
name = "advsetuptools"
version = "v0"
requires-python = ">=3.12"
dependencies = [
    "setuptools==84.2.1",
    "ghp-import==2.1.0",
    "mypy==2.4.1",
    "sphinx==9.1.1",
    "sphinx-autodoc2; python_version <= '3.13'",
    "sphinx-autodoc2 @ git+https://github.com/MineFartS/sphinx-autodoc2 ; python_version >= '3.14'",
]

[tool.setuptools.package-data]
"advsetuptools" = ["include/**/*"]

