[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "autodoc2"

[project]
name = "sphinx-autodoc2"
version = "0.5.0"
dynamic = ["description"]
requires-python = ">=3.8"
dependencies = [
    "astroid>=4.3.0",
    "tomli; python_version<'3.11'",
    "typing-extensions"
]

